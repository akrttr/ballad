<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballad — Menü</title>
<meta name="description" content="Ballad menüsü — kahve, soğuk içecekler, çaylar, kaseler, sandviçler ve tatlılar.">
<meta name="theme-color" content="#140F0C">
<meta name="robots" content="noindex">
<meta property="og:title" content="Ballad — Menü">
<meta property="og:description" content="Ballad menüsü">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140F0C; --panel:#1C1613; --cream:#ECE3D2; --cream-dim:#A2937C;
    --brass:#D49A4E; --brass-soft:#E7C088; --line:rgba(236,227,210,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--cream);
    font-family:'Spectral',Georgia,serif;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
    background:
      radial-gradient(120% 70% at 80% -10%, rgba(212,154,78,.10), transparent 55%),
      radial-gradient(90% 60% at -10% 110%, rgba(79,154,141,.07), transparent 55%);
  }
  .wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:0 16px}

  /* header */
  header{text-align:center;padding:30px 16px 14px}
  header img{height:34px;width:auto;display:block;margin:0 auto 12px;
    filter:drop-shadow(0 2px 14px rgba(0,0,0,.5))}
  header .eyebrow{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.42em;
    font-size:.7rem;color:var(--brass);
  }

  /* tabs */
  .tabs{
    position:sticky;top:0;z-index:5;
    display:flex;gap:10px;justify-content:center;
    padding:14px 16px;margin:0 -16px;
    background:linear-gradient(to bottom, rgba(20,15,12,.96) 70%, rgba(20,15,12,0));
    backdrop-filter:blur(4px);
  }
  .tab{
    flex:1;max-width:220px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-size:.82rem;font-weight:500;color:var(--cream);
    background:rgba(28,22,19,.7);border:1px solid var(--line);border-radius:3px;
    padding:13px 10px;cursor:pointer;transition:all .22s;
  }
  .tab:hover{border-color:rgba(212,154,78,.5)}
  .tab.active{background:var(--brass);color:#140F0C;border-color:var(--brass)}

  /* panels */
  main{padding:18px 0 10px}
  .panel{display:none}
  .panel.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .menu-img{
    width:100%;height:auto;display:block;border-radius:6px;
    border:1px solid var(--line);
    box-shadow:0 18px 40px -18px rgba(0,0,0,.8);
    background:#1a1310;
  }
  .panel + .panel{margin-top:0}

  /* footer */
  footer{text-align:center;padding:26px 16px 38px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
  .links a{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-size:.74rem;color:var(--cream);text-decoration:none;
    border:1px solid var(--line);border-radius:2px;padding:10px 16px;transition:all .22s;
  }
  .links a:hover,.links a:focus-visible{border-color:var(--brass);color:var(--brass)}
  footer .note{font-style:italic;color:var(--cream-dim);font-size:.86rem}
  footer .ft-mark{
    font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
    color:var(--cream-dim);font-size:.8rem;margin-top:14px;
  }
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header>
    <img src="/logo.png" alt="Ballad">
    <div class="eyebrow">Menü</div>
  </header>

  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab active" type="button" data-target="icecekler" aria-selected="true">İçecekler</button>
      <button class="tab" type="button" data-target="yemek" aria-selected="false">Yemek &amp; Tatlı</button>
    </div>

    <main>
      <section class="panel show" id="icecekler">
        <img class="menu-img" src="menu-1.jpg" alt="Ballad içecek menüsü — sıcak içecekler, soğuk içecekler ve çaylar fiyat listesi">
      </section>
      <section class="panel" id="yemek">
        <img class="menu-img" src="menu-2.jpg" alt="Ballad yemek menüsü — kaseler, sandviçler ve tatlılar fiyat listesi" loading="lazy">
      </section>
    </main>

    <footer>
      <div class="links">
        <a href="https://www.instagram.com/balladankara/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://share.google/3SunqbG92EnU8MVCG" target="_blank" rel="noopener">Haritada Aç</a>
        <a href="https://balladankara.com">Web Sitesi</a>
      </div>
      <p class="note">Afiyet olsun.</p>
      <div class="ft-mark">Ballad · Ankara</div>
    </footer>
  </div>

  <script>
    (function(){
      var tabs = document.querySelectorAll('.tab');
      var panels = document.querySelectorAll('.panel');
      tabs.forEach(function(t){
        t.addEventListener('click', function(){
          tabs.forEach(function(x){x.classList.remove('active');x.setAttribute('aria-selected','false');});
          panels.forEach(function(p){p.classList.remove('show');});
          t.classList.add('active'); t.setAttribute('aria-selected','true');
          document.getElementById(t.dataset.target).classList.add('show');
          window.scrollTo({top:0,behavior:'smooth'});
        });
      });
    })();
  </script>
</body>
</html>
